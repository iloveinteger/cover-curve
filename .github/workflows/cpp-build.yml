name: C++ build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Direct height smoke
        run: /usr/bin/time -f '%e s' ./build/cover_curve_direct_height_smoke

      - name: Benchmark solver
        run: ./build/cover_curve_benchmark

      - name: Known optimum test
        run: timeout 60 ./build/cover_curve_coordinate_search_test
