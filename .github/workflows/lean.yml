name: Lean formalization

on:
  push:
    branches: [main]
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/lean
    steps:
      - uses: actions/checkout@v5
      - name: Generate Lake manifest
        run: lake update
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
