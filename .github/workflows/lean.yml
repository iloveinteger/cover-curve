name: Lean formalization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lean + Mathlib
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: formal/lean

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: false
          test: false
          use-mathlib-cache: true

      - name: Generate Lake manifest
        run: lake update

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
