name: Lean formalization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lean + Mathlib
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: formal/lean

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Elan and Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate Lake manifest
        run: lake update

      - name: Build and audit Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
