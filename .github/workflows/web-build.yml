name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
      - name: Build WebAssembly
        run: cmake --build build-web --parallel
      - name: Verify web output
        run: test -f web/cover_curve.js && test -f web/cover_curve.wasm && test -f web/solver-worker.js && test -f web/expression.js
