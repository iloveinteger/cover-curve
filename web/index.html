<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Curve</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="eyebrow">NUMERICAL OPTIMIZATION</div>
      <h1>Cover Curve</h1>
      <p>Find the minimum-area piecewise-linear curve that stays above <em>f(x)</em>.</p>
    </header>

    <section class="panel controls">
      <div class="section-heading">
        <div>
          <h2>Define your curve</h2>
          <p>Enter a supported mathematical expression in <em>x</em>.</p>
        </div>
      </div>
      <label class="function-field">Function <span>f(x)</span>
        <input id="expression" value="x^2" spellcheck="false" autocomplete="off">
      </label>
      <div class="grid">
        <label>Start <span>a</span><input id="a" type="number" value="0" step="any"></label>
        <label>End <span>b</span><input id="b" type="number" value="1" step="any"></label>
        <label>Segments <span>n</span><input id="n" type="number" value="2" min="1" step="1"></label>
      </div>
      <button id="solve" disabled>Solve curve</button>
      <p id="status" aria-live="polite">Loading solver...</p>
    </section>

    <section class="panel result-panel">
      <div class="result-header">
        <div>
          <div class="eyebrow">RESULT</div>
          <h2>Optimal cover</h2>
        </div>
        <div class="metric">
          <span>Minimum area</span>
          <strong id="value">—</strong>
        </div>
      </div>
      <canvas id="plot" width="900" height="500" aria-label="Function and upper approximation plot"></canvas>
      <pre id="details"></pre>
    </section>
  </main>
  <script src="expression.js"></script>
  <script src="cover_curve.js"></script>
  <script src="app.js"></script>
</body>
</html>
